{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="narrow"><p class="eyebrow">Chào mừng trở lại</p><h1>Đăng nhập</h1><p class="muted">Tiếp tục khám phá những cuốn sách phù hợp với bạn.</p><form class="panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_path }}">
  <label class="form-field">Email<input name="email" type="email" value="{{ request.form.get('email', '') }}" required autocomplete="email"></label>
  <label class="form-field">Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label>
  <button class="button" type="submit">Đăng nhập</button>
</form><p class="muted">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký</a>.</p></section>
{% endblock %}
